<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceFlow Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">

</head>

<body>
    <header>
        <h1>InvoiceFlow</h1>
        <p>Small Business Management System</p>
    </header>

    <main>
        <h2>Dashboard</h2>
        <p>Welcome! Here is an overview of your business.</p>

<section>
    <h3>Customers</h3>
    <p>{{ customer_count }}</p>
    <a class="manage-link" href="/customers">Manage Customers</a>
</section>

       <section>
    <h3>Total Invoices</h3>
    <p>{{ invoice_count }}</p>
    <a class="manage-link" href="/invoices">Manage Invoices</a>
</section>

<section>
    <h3>Paid</h3>
    <p>TZS {{ paid_total }}</p>
</section>

<section>
    <h3>Outstanding</h3>
    <p>TZS {{ outstanding_total }}</p>
</section>
    </main>
</body>
</html>
